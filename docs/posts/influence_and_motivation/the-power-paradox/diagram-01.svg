<title id="title">Visualizing the Power Paradox</title><desc id="description">Power leads to Increased Testosterone. Power leads to Decreased Cortisol. Increased Testosterone leads to Reduced Empathy. Decreased Cortisol leads to Increased Risk-Taking. Reduced Empathy leads to Unethical Behavior. Increased Risk-Taking leads to Unethical Behavior. Power leads to Inflated Self-Esteem. Inflated Self-Esteem leads to Overconfidence. Overconfidence leads to Unethical Behavior. Ethical Strategies leads to Empathy. Ethical Strategies leads to Humility. Ethical Strategies leads to Accountability. Empathy leads to Positive Outcomes. Humility leads to Positive Outcomes. Accountability leads to Positive Outcomes. Unethical Behavior leads to Negative Outcomes. Positive Outcomes leads to Fulfilling Life. Negative Outcomes leads to Damaged Relationships.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 458)">
