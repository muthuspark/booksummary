<title id="title">Finding Purpose in Different Life Stages</title><desc id="description">Self-Awareness leads to Values. Self-Awareness leads to Passions. Self-Awareness leads to Talents. Values leads to Purpose Statement. Passions leads to Purpose Statement. Talents leads to Purpose Statement. Purpose Statement leads to Goal Setting. Goal Setting leads to Action Plan. Action Plan leads to Support Network. Support Network leads to Overcoming Obstacles. Overcoming Obstacles leads to Embracing Change. Embracing Change leads to Continuous Growth.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 634)">
