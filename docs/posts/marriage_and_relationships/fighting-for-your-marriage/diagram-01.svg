<title id="title">Visualizing Key Concepts</title><desc id="description">Constructive Communication leads to Active Listening. Constructive Communication leads to Empathy. Constructive Communication leads to "I" Statements. Active Listening leads to Conflict Resolution. Empathy leads to Conflict Resolution. "I" Statements leads to Conflict Resolution. Conflict Resolution leads to Shared Values &amp; Goals. Conflict Resolution leads to Understanding Needs. Shared Values &amp; Goals leads to Stronger Marriage. Understanding Needs leads to Stronger Marriage. Stronger Marriage leads to Intimacy &amp; Affection. Intimacy &amp; Affection leads to Stronger Marriage. Conflict Resolution leads to Seeking Professional Help (if needed).</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 458)">
