<title id="title">Key Concepts Diagram</title><desc id="description">Presence leads to Mindfulness. Presence leads to Meditation. Presence leads to Yoga. Presence leads to Mindful Activities. Meditation leads to Quiet Mind. Yoga leads to Body Awareness. Mindful Activities leads to Sensory Experience. Mindfulness leads to Self-Awareness. Self-Awareness leads to Ego Transcendence. Ego Transcendence leads to Self-Compassion. Ego Transcendence leads to Surrender. Ego Transcendence leads to Service. Ego Transcendence leads to Love &amp; Compassion. Ego Transcendence leads to Enlightenment. Enlightenment leads to Mindful Living. Enlightenment leads to Compassionate Action. Enlightenment leads to Acceptance. Enlightenment leads to Gratitude.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 418)">
