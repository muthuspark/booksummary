<title id="title">The Monomyth and Its Stages</title><desc id="description">The Ordinary World leads to The Call to Adventure. The Call to Adventure leads to Refusal of the Call. Refusal of the Call leads to Meeting the Mentor. Meeting the Mentor leads to Crossing the Threshold. Crossing the Threshold leads to Tests, Allies, Enemies. Tests, Allies, Enemies leads to Approach to the Inmost Cave. Approach to the Inmost Cave leads to The Ordeal. The Ordeal leads to Reward (Seizing the Sword). Reward (Seizing the Sword) leads to The Road Back. The Road Back leads to Resurrection. Resurrection leads to Return with the Elixir.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 930)">
