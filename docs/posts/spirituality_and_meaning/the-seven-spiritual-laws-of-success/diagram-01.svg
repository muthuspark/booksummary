<title id="title">Interconnectedness of the Seven Laws</title><desc id="description">Pure Potentiality leads to Giving. Pure Potentiality leads to Karma. Pure Potentiality leads to Least Effort. Pure Potentiality leads to Intention &amp; Desire. Pure Potentiality leads to Detachment. Pure Potentiality leads to Dharma. Giving leads to Karma. Karma leads to Least Effort. Least Effort leads to Intention &amp; Desire. Intention &amp; Desire leads to Detachment. Detachment leads to Dharma. Dharma leads to Giving.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 490)">
