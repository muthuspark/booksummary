<title id="title">The Barefoot Budget</title><desc id="description">Income leads to Essential Expenses. Essential Expenses leads to Housing. Essential Expenses leads to Utilities. Essential Expenses leads to Food. Essential Expenses leads to Transportation. Income leads to Discretionary Expenses. Discretionary Expenses leads to Entertainment. Discretionary Expenses leads to Dining Out. Discretionary Expenses leads to Travel.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 430)">
