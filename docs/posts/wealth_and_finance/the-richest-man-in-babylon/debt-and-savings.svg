<svg xmlns="http://www.w3.org/2000/svg" width="640" height="543" viewBox="0 0 640 543" role="img" aria-labelledby="title desc"><title id="title">How debt squeezes savings</title><desc id="desc">Debt creates interest payments, leaving less income to save and invest and slowing wealth building. The diagram illustrates the cost of carrying debt.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#22635f"/></marker></defs><rect width="640" height="543" rx="18" fill="#fbf7ed"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="49" fill="#203c40" font-size="28" text-anchor="start" font-weight="700">How debt squeezes savings</text><text x="32" y="90" fill="#536663" font-size="22" text-anchor="start" font-weight="400">The cost of carrying debt</text><rect x="32" y="117" width="576" height="98" rx="12" fill="#f2e5cc"/><text x="58" y="161" fill="#22635f" font-size="27" text-anchor="start" font-weight="700">01</text><text x="110" y="156" fill="#203c40" font-size="24" text-anchor="start" font-weight="700">Interest takes a share</text><text x="110" y="190" fill="#536663" font-size="21" text-anchor="start" font-weight="400">Part of your income services the debt.</text><path d="M320 222 L320 248" fill="none" stroke="#22635f" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="260" width="576" height="98" rx="12" fill="#e7efea"/><text x="58" y="304" fill="#22635f" font-size="27" text-anchor="start" font-weight="700">02</text><text x="110" y="299" fill="#203c40" font-size="24" text-anchor="start" font-weight="700">Less remains to save</text><text x="110" y="333" fill="#536663" font-size="21" text-anchor="start" font-weight="400">More obligations leave less flexibility.</text><path d="M320 365 L320 391" fill="none" stroke="#22635f" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="403" width="576" height="98" rx="12" fill="#e7efea"/><text x="58" y="447" fill="#22635f" font-size="27" text-anchor="start" font-weight="700">03</text><text x="110" y="442" fill="#203c40" font-size="24" text-anchor="start" font-weight="700">Wealth builds more slowly</text><text x="110" y="476" fill="#536663" font-size="21" text-anchor="start" font-weight="400">Less capital is available to earn returns.</text></g></svg>
