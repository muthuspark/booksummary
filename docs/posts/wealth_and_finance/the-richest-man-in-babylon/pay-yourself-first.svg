<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-labelledby="title desc"><title id="title">Keep the first tenth</title><desc id="desc">For every 100 coins earned, save at least 10 before budgeting the remaining 90 for living costs.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#22635f"/></marker></defs><rect width="640" height="410" rx="18" fill="#fbf7ed"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="49" fill="#203c40" font-size="28" text-anchor="start" font-weight="700">Keep the first tenth</text><text x="32" y="90" fill="#536663" font-size="22" text-anchor="start" font-weight="400">For every 100 coins earned</text><rect x="32" y="122" width="52" height="74" rx="5" fill="#22635f"/><text x="58" y="169" fill="#ffffff" font-size="21" text-anchor="middle" font-weight="700">10</text><rect x="90" y="122" width="52" height="74" rx="5" fill="#ded6c4"/><text x="116" y="169" fill="#203c40" font-size="21" text-anchor="middle" font-weight="700">10</text><rect x="148" y="122" width="52" height="74" rx="5" fill="#ded6c4"/><text x="174" y="169" fill="#203c40" font-size="21" text-anchor="middle" font-weight="700">10</text><rect x="206" y="122" width="52" height="74" rx="5" fill="#ded6c4"/><text x="232" y="169" fill="#203c40" font-size="21" text-anchor="middle" font-weight="700">10</text><rect x="264" y="122" width="52" height="74" rx="5" fill="#ded6c4"/><text x="290" y="169" fill="#203c40" font-size="21" text-anchor="middle" font-weight="700">10</text><rect x="322" y="122" width="52" height="74" rx="5" fill="#ded6c4"/><text x="348" y="169" fill="#203c40" font-size="21" text-anchor="middle" font-weight="700">10</text><rect x="380" y="122" width="52" height="74" rx="5" fill="#ded6c4"/><text x="406" y="169" fill="#203c40" font-size="21" text-anchor="middle" font-weight="700">10</text><rect x="438" y="122" width="52" height="74" rx="5" fill="#ded6c4"/><text x="464" y="169" fill="#203c40" font-size="21" text-anchor="middle" font-weight="700">10</text><rect x="496" y="122" width="52" height="74" rx="5" fill="#ded6c4"/><text x="522" y="169" fill="#203c40" font-size="21" text-anchor="middle" font-weight="700">10</text><rect x="554" y="122" width="52" height="74" rx="5" fill="#ded6c4"/><text x="580" y="169" fill="#203c40" font-size="21" text-anchor="middle" font-weight="700">10</text><rect x="32" y="226" width="576" height="66" rx="12" fill="#e7efea"/><text x="54" y="268" fill="#22635f" font-size="25" text-anchor="start" font-weight="700">10+ coins → savings first</text><text x="32" y="335" fill="#203c40" font-size="23" text-anchor="start" font-weight="700">Budget the remaining 90 coins or less</text><text x="32" y="373" fill="#536663" font-size="22" text-anchor="start" font-weight="400">for living costs, wants and obligations.</text></g></svg>
