<title id="title">Four Leadership Styles and Their Impact</title><desc id="description">Visionary leads to Inspiring. Visionary leads to Future-Oriented. Coaching leads to Development. Coaching leads to Mentoring. Affiliative leads to Harmony. Affiliative leads to Team Building. Democratic leads to Collaboration. Democratic leads to Participation. Pacesetting leads to High Standards. Pacesetting leads to Excellence. Commanding leads to Direct Instructions. Commanding leads to Compliance.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 740)">
