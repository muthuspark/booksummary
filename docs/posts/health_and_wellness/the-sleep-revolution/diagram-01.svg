<title id="title">The Science of Sleep: Understanding Your Body Clock</title><desc id="description">Circadian Rhythm leads to Sleep-Wake Cycle. Sleep-Wake Cycle leads to REM Sleep. Sleep-Wake Cycle leads to NREM Sleep. REM Sleep leads to Memory Consolidation. NREM Sleep leads to Physical Restoration. Memory Consolidation leads to Cognitive Function. Physical Restoration leads to Immune Function. Cognitive Function leads to Productivity. Immune Function leads to Productivity.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 458)">
