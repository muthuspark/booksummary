<title id="title">Actionable and Visual Representation:</title><desc id="description">Eat Food leads to Short Ingredient Lists. Eat Food leads to Foods that Spoil. Eat Food leads to Cook from Scratch. Not Too Much leads to Mindful Eating. Not Too Much leads to Pay Attention to Hunger/Fullness. Not Too Much leads to Eat Slowly. Mostly Plants leads to Prioritize Fruits &amp; Vegetables. Mostly Plants leads to Include Whole Grains &amp; Legumes. Short Ingredient Lists leads to Reduced Chronic Diseases (Improves Health). Foods that Spoil leads to Reduced Chronic Diseases (Improves Nutrition). Cook from Scratch leads to Reduced Chronic Diseases (Enhances Control). Mindful Eating leads to Reduced Chronic Diseases (Enhances Satisfaction). Pay Attention to Hunger/Fullness leads to Reduced Chronic Diseases (Prevents Overeating). Eat Slowly leads to Reduced Chronic Diseases (Promotes Enjoyment). Prioritize Fruits &amp; Vegetables leads to Reduced Chronic Diseases (Increases Nutrient Intake). Include Whole Grains &amp; Legumes leads to Reduced Chronic Diseases (Improves Digestive Health). Reduced Chronic Diseases leads to Improved Well-being.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 552)">
