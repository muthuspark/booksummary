<title id="title">The Prolon Fasting Mimicking Diet (FMD) in Detail</title><desc id="description">Daily Diet leads to Plant-Based Foods. Daily Diet leads to Healthy Fats. Daily Diet leads to Moderate Protein. Daily Diet leads to Low Sugar. Daily Diet leads to Limited Processed Foods. Limited Processed Foods leads to Inflammation. Inflammation leads to Aging &amp; Disease. Daily Diet leads to FMD Cycles. FMD Cycles leads to Autophagy. Autophagy leads to Cellular Repair. Cellular Repair leads to Improved Healthspan.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 388)">
