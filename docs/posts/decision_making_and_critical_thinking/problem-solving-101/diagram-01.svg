<title id="title">Defining the Problem</title><desc id="description">Problem: Slow Computer leads to Why?. Why? leads to Old Hard Drive?. Old Hard Drive? leads to Root Cause: Hard Drive Needs Replacing (Yes). Old Hard Drive? leads to Why? (No). Why? leads to Insufficient RAM?. Insufficient RAM? leads to Root Cause: Upgrade RAM (Yes). Insufficient RAM? leads to Why? (No). Why? leads to Malware?. Malware? leads to Root Cause: Malware Removal (Yes).</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 797)">
