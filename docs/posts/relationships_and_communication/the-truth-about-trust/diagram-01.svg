<title id="title">Trust as a Calculated Risk: The Role of Emotions</title><desc id="description">Fear (Amygdala) leads to Risk Assessment. Trust (Prefrontal Cortex) leads to Risk Assessment. Risk Assessment leads to Calculated Risk. Calculated Risk leads to Cooperation &amp; Mutual Gain. Calculated Risk leads to Potential Loss/Betrayal.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 354)">
