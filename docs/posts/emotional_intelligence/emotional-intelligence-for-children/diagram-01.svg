<title id="title">Managing Emotions: Coping with Difficult Feelings</title><desc id="description">Difficult Emotion leads to Identify Emotion. Identify Emotion leads to Coping Mechanism. Coping Mechanism leads to Deep Breathing. Coping Mechanism leads to Positive Self-Talk. Coping Mechanism leads to Problem Solving. Coping Mechanism leads to Seeking Support. Deep Breathing leads to Calm. Positive Self-Talk leads to Calm. Problem Solving leads to Calm. Seeking Support leads to Calm.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 386)">
