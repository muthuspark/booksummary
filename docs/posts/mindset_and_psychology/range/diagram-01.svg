<title id="title">The Power of Interleaving</title><desc id="description">Blocking: Focused on one skill leads to Repetition. Interleaving: Switching between skills leads to Adaptation &amp; Retrieval. Repetition leads to Improved skill in that one area. Adaptation &amp; Retrieval leads to Improved broader skill &amp; adaptability.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 302)">
