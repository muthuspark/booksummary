<title id="title">The Dopamine System and its Feedback Loops</title><desc id="description">Positive Experience leads to Dopamine Release. Dopamine Release leads to Reinforced Behavior. Reinforced Behavior leads to Positive Experience. Negative Experience leads to Dopamine Dip. Dopamine Dip leads to Seeking Behavior. Seeking Behavior leads to Negative Experience.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 202)">
