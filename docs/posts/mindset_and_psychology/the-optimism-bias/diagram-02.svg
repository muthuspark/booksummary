<title id="title">Harnessing Optimism for Goal Achievement</title><desc id="description">Goal leads to Realistic Optimism. Realistic Optimism leads to Effective Planning. Realistic Optimism leads to Contingency Planning. Realistic Optimism leads to Persistence. Effective Planning leads to Increased Chances of Success. Contingency Planning leads to Mitigation of Setbacks. Persistence leads to Resilience to Challenges. Increased Chances of Success leads to Goal Achievement. Mitigation of Setbacks leads to Goal Achievement. Resilience to Challenges leads to Goal Achievement.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 406)">
