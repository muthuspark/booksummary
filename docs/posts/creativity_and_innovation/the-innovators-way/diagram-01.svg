<title id="title">Principle 10:  Be Persistent</title><desc id="description">Deep Understanding leads to Challenge Assumptions. Challenge Assumptions leads to Iterate &amp; Experiment. Iterate &amp; Experiment leads to Seek Feedback. Seek Feedback leads to Cultivate Curiosity. Cultivate Curiosity leads to Embrace Failure. Embrace Failure leads to Supportive Environment. Supportive Environment leads to Focus on Value. Focus on Value leads to Persistence. Persistence leads to Successful Innovation.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 786)">
