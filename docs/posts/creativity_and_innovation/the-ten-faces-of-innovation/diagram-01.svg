<title id="title">Interconnectedness of the Ten Faces</title><desc id="description">Anthropologist leads to User Understanding. Experimenter leads to Trial &amp; Error. Cross-Pollinator leads to Diverse Inspiration. Hurdler leads to Problem Solving. Collaborator leads to Teamwork. Director leads to Project Management. Storyteller leads to Communication. Caregiver leads to Nurturing Innovation. Set Designer leads to Immersive Experience. Challenger leads to Critical Thinking. User Understanding leads to Teamwork (Synergistic Effects). Trial &amp; Error leads to Problem Solving (Synergistic Effects). Diverse Inspiration leads to Communication (Synergistic Effects). Problem Solving leads to Nurturing Innovation (Synergistic Effects). Teamwork leads to Project Management (Synergistic Effects). Project Management leads to Immersive Experience (Synergistic Effects). Communication leads to Critical Thinking (Synergistic Effects). Nurturing Innovation leads to Immersive Experience (Synergistic Effects). Immersive Experience leads to User Understanding (Synergistic Effects). Critical Thinking leads to Trial &amp; Error (Synergistic Effects). Ten Faces of Innovation: Anthropologist, Experimenter, Cross-Pollinator, Hurdler, Collaborator, Director, Storyteller, Caregiver, Set Designer, Challenger.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 831)">
