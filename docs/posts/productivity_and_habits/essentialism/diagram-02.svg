<title id="title">Beyond Productivity:  A Path to Meaning and Fulfillment</title><desc id="description">Explore leads to Define Values. Define Values leads to Set Goals. Set Goals leads to Eliminate. Eliminate leads to Say No. Eliminate leads to Delegate. Eliminate leads to Remove. Say No leads to Execute. Execute leads to Time Blocking. Execute leads to Batching. Execute leads to Minimize Distractions. Execute leads to Prioritize. Execute leads to Evaluate. Evaluate leads to Reflect. Evaluate leads to Adjust.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 562)">
