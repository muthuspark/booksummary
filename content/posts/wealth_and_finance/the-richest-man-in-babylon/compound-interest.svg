<svg xmlns="http://www.w3.org/2000/svg" width="640" height="545" viewBox="0 0 640 545" role="img" aria-labelledby="title desc"><title id="title">Let earnings earn more</title><desc id="desc">Illustrative compound interest: 100 coins at a fixed 5% annual rate become 127.63 after five years and 162.89 after ten years, with no added deposits, fees or taxes. Actual returns vary.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#22635f"/></marker></defs><rect width="640" height="545" rx="18" fill="#fbf7ed"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="49" fill="#203c40" font-size="28" text-anchor="start" font-weight="700">Let earnings earn more</text><text x="32" y="88" fill="#536663" font-size="22" text-anchor="start" font-weight="400">100 coins • 5% annually • interest reinvested</text><path d="M84 365.0 H592" stroke="#dcd7cb" stroke-width="1"/><text x="70" y="372.0" fill="#536663" font-size="19" text-anchor="end" font-weight="400">100</text><path d="M84 287.5 H592" stroke="#dcd7cb" stroke-width="1"/><text x="70" y="294.5" fill="#536663" font-size="19" text-anchor="end" font-weight="400">125</text><path d="M84 210.0 H592" stroke="#dcd7cb" stroke-width="1"/><text x="70" y="217.0" fill="#536663" font-size="19" text-anchor="end" font-weight="400">150</text><path d="M84 365 L84.0 365.0 L133.0 349.5 L182.0 333.2 L231.0 316.1 L280.0 298.2 L329.0 279.4 L378.0 259.6 L427.0 238.8 L476.0 217.0 L525.0 194.1 L574.0 170.0 L574 365 Z" fill="#dfeae2"/><polyline points="84.0,365.0 133.0,349.5 182.0,333.2 231.0,316.1 280.0,298.2 329.0,279.4 378.0,259.6 427.0,238.8 476.0,217.0 525.0,194.1 574.0,170.0" fill="none" stroke="#22635f" stroke-width="4"/><circle cx="84" cy="365.0" r="6" fill="#22635f"/><text x="84" y="349.0" fill="#22635f" font-size="21" text-anchor="middle" font-weight="700">100.00</text><text x="84" y="402" fill="#536663" font-size="20" text-anchor="middle" font-weight="400">Year 0</text><circle cx="329" cy="279.3527156249999" r="6" fill="#22635f"/><text x="329" y="263.3527156249999" fill="#22635f" font-size="21" text-anchor="middle" font-weight="700">127.63</text><text x="329" y="402" fill="#536663" font-size="20" text-anchor="middle" font-weight="400">Year 5</text><circle cx="574" cy="170.04266569899295" r="6" fill="#22635f"/><text x="574" y="154.04266569899295" fill="#22635f" font-size="21" text-anchor="middle" font-weight="700">162.89</text><text x="574" y="402" fill="#536663" font-size="20" text-anchor="middle" font-weight="400">Year 10</text><text x="32" y="449" fill="#203c40" font-size="23" text-anchor="start" font-weight="700">Interest earns interest as the balance grows.</text><text x="32" y="488" fill="#536663" font-size="20" text-anchor="start" font-weight="400">Illustration only: fixed rate, no added deposits,</text><text x="32" y="515" fill="#536663" font-size="20" text-anchor="start" font-weight="400">fees or taxes. Actual returns vary.</text></g></svg>
