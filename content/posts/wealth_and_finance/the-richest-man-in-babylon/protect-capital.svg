<svg xmlns="http://www.w3.org/2000/svg" width="640" height="580" viewBox="0 0 640 580" role="img" aria-labelledby="title desc"><title id="title">Protect the principal</title><desc id="desc">Before investing, understand how the investment earns, examine potential losses and seek relevant advice. Diversifying can spread exposure but does not eliminate loss.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#22635f"/></marker></defs><rect width="640" height="580" rx="18" fill="#fbf7ed"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="49" fill="#203c40" font-size="28" text-anchor="start" font-weight="700">Protect the principal</text><text x="32" y="90" fill="#536663" font-size="22" text-anchor="start" font-weight="400">Check the opportunity before committing.</text><rect x="32" y="117" width="576" height="98" rx="12" fill="#e7efea"/><text x="58" y="161" fill="#22635f" font-size="27" text-anchor="start" font-weight="700">01</text><text x="110" y="156" fill="#203c40" font-size="24" text-anchor="start" font-weight="700">Understand the investment</text><text x="110" y="190" fill="#536663" font-size="21" text-anchor="start" font-weight="400">Can you explain how it earns money?</text><path d="M320 222 L320 248" fill="none" stroke="#22635f" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="260" width="576" height="98" rx="12" fill="#e7efea"/><text x="58" y="304" fill="#22635f" font-size="27" text-anchor="start" font-weight="700">02</text><text x="110" y="299" fill="#203c40" font-size="24" text-anchor="start" font-weight="700">Examine the downside</text><text x="110" y="333" fill="#536663" font-size="21" text-anchor="start" font-weight="400">What could go wrong or be lost?</text><path d="M320 365 L320 391" fill="none" stroke="#22635f" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="403" width="576" height="98" rx="12" fill="#e7efea"/><text x="58" y="447" fill="#22635f" font-size="27" text-anchor="start" font-weight="700">03</text><text x="110" y="442" fill="#203c40" font-size="24" text-anchor="start" font-weight="700">Seek informed advice</text><text x="110" y="476" fill="#536663" font-size="21" text-anchor="start" font-weight="400">Check assumptions; spread exposure.</text><text x="32" y="549" fill="#536663" font-size="21" text-anchor="start" font-weight="400">Diversification does not eliminate loss.</text></g></svg>
