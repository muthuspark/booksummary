<svg xmlns="http://www.w3.org/2000/svg" width="640" height="508" viewBox="0 0 640 508" role="img" aria-labelledby="title desc"><title id="title">Give every expense a purpose</title><desc id="desc">Protect savings first. Budget for essentials, then consider wants only if they fit the remaining budget. Postpone anything that does not fit.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#22635f"/></marker></defs><rect width="640" height="508" rx="18" fill="#fbf7ed"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="49" fill="#203c40" font-size="28" text-anchor="start" font-weight="700">Give every expense a purpose</text><text x="32" y="90" fill="#536663" font-size="22" text-anchor="start" font-weight="400">After setting aside your savings…</text><rect x="32" y="117" width="576" height="98" rx="12" fill="#e7efea"/><text x="58" y="161" fill="#22635f" font-size="27" text-anchor="start" font-weight="700">01</text><text x="110" y="156" fill="#203c40" font-size="24" text-anchor="start" font-weight="700">Cover essentials</text><text x="110" y="190" fill="#536663" font-size="21" text-anchor="start" font-weight="400">Plan for food, shelter and obligations.</text><path d="M320 222 L320 248" fill="none" stroke="#22635f" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="260" width="576" height="98" rx="12" fill="#e7efea"/><text x="58" y="304" fill="#22635f" font-size="27" text-anchor="start" font-weight="700">02</text><text x="110" y="299" fill="#203c40" font-size="24" text-anchor="start" font-weight="700">Evaluate wants</text><text x="110" y="333" fill="#536663" font-size="21" text-anchor="start" font-weight="400">Does this fit the money left to spend?</text><path d="M320 365 L320 391" fill="none" stroke="#22635f" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="402" width="576" height="75" rx="12" fill="#f2e5cc"/><text x="56" y="433" fill="#203c40" font-size="23" text-anchor="start" font-weight="700">Fits? Plan the purchase.</text><text x="56" y="462" fill="#536663" font-size="22" text-anchor="start" font-weight="400">Doesn’t fit? Postpone or skip it.</text></g></svg>
