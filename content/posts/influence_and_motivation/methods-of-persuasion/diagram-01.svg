<title id="title">The Power of Framing</title><desc id="description">Information leads to Gain Framing. Information leads to Loss Framing. Gain Framing leads to Positive Response. Loss Framing leads to Positive Response (Often Stronger). Information leads to Positive Framing. Information leads to Negative Framing. Positive Framing leads to Positive Response. Negative Framing leads to Positive Response (Often Stronger).</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 404)">
