<title id="title">Actionable and Practical Framework</title><desc id="description">Identify Situation leads to Cognitive Biases Present?. Cognitive Biases Present? leads to Employ Countermeasures (Yes). Cognitive Biases Present? leads to Proceed with Analysis (No). Employ Countermeasures leads to Structured Decision Making. Structured Decision Making leads to Gather Diverse Data. Gather Diverse Data leads to Evaluate &amp; Adjust. Evaluate &amp; Adjust leads to Implement Decision. Proceed with Analysis leads to Evaluate &amp; Adjust. Implement Decision leads to Reflect &amp; Learn. Reflect &amp; Learn leads to Identify Situation.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 724)">
