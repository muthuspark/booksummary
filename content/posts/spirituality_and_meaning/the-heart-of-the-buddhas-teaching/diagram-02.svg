<title id="title">The Path to the Cessation of Suffering: The Eightfold Path</title><desc id="description">Right Understanding leads to Right Thought. Right Thought leads to Right Speech. Right Speech leads to Right Action. Right Action leads to Right Livelihood. Right Livelihood leads to Right Effort. Right Effort leads to Right Mindfulness. Right Mindfulness leads to Right Concentration. Right Concentration leads to Cessation of Suffering. Right Understanding leads to Cessation of Suffering (dashed connection). Right Thought leads to Cessation of Suffering (dashed connection). Right Speech leads to Cessation of Suffering (dashed connection). Right Action leads to Cessation of Suffering (dashed connection). Right Livelihood leads to Cessation of Suffering (dashed connection). Right Effort leads to Cessation of Suffering (dashed connection). Right Mindfulness leads to Cessation of Suffering (dashed connection).</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 634)">
