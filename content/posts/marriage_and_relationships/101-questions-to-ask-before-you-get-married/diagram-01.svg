<title id="title">Long-Term Vision:  Planning for the Future</title><desc id="description">Understanding Values &amp; Goals leads to Effective Communication. Effective Communication leads to Financial Planning. Effective Communication leads to Family &amp; Friends Dynamics. Effective Communication leads to Spiritual &amp; Religious Beliefs. Effective Communication leads to Sexual Intimacy. Effective Communication leads to Conflict Resolution. Conflict Resolution leads to Premarital Counseling. Financial Planning leads to Premarital Counseling. Family &amp; Friends Dynamics leads to Premarital Counseling. Spiritual &amp; Religious Beliefs leads to Premarital Counseling. Sexual Intimacy leads to Premarital Counseling. Premarital Counseling leads to Lifestyle &amp; Habits. Lifestyle &amp; Habits leads to Long-Term Vision. Understanding Values &amp; Goals leads to Long-Term Vision.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 498)">
