<title id="title">The Importance of Intentional Rest</title><desc id="description">Work leads to Physical Rest. Work leads to Mental Rest. Work leads to Emotional Rest. Work leads to Creative Rest. Work leads to Social Rest. Physical Rest leads to Improved Energy. Mental Rest leads to Improved Energy. Emotional Rest leads to Improved Energy. Creative Rest leads to Improved Energy. Social Rest leads to Improved Energy. Improved Energy leads to Increased Productivity &amp; Well-being.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 306)">
