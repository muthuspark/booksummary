<title id="title">A Framework for Enhancing Team Emotional Intelligence</title><desc id="description">Leadership Commitment leads to Create Safe Space. Leadership Commitment leads to Promote Self-Reflection. Leadership Commitment leads to Provide Constructive Feedback. Leadership Commitment leads to Model Emotional Regulation. Create Safe Space leads to Team Emotional Self-Awareness. Promote Self-Reflection leads to Team Emotional Self-Awareness. Provide Constructive Feedback leads to Team Emotional Self-Awareness. Model Emotional Regulation leads to Team Emotional Self-Awareness. Team Emotional Self-Awareness leads to Develop Emotional Vocabulary. Team Emotional Self-Awareness leads to Conflict Resolution Training. Team Emotional Self-Awareness leads to Building Trust &amp; Psychological Safety. Develop Emotional Vocabulary leads to Improved Team Performance. Conflict Resolution Training leads to Improved Team Performance. Building Trust &amp; Psychological Safety leads to Improved Team Performance.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 486)">
