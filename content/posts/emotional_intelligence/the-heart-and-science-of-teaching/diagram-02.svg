<title id="title">The Power of  Positive Reinforcement and Restorative Justice</title><desc id="description">Misbehavior leads to Restorative Justice. Restorative Justice leads to Repairing Harm. Restorative Justice leads to Reconciliation. Repairing Harm leads to Stronger Classroom Community. Reconciliation leads to Stronger Classroom Community. Misbehavior leads to Punitive Measures. Punitive Measures leads to Damaged Relationships.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 294)">
