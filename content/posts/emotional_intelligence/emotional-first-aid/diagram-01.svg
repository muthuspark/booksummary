<title id="title">The Four Pillars of Emotional First Aid</title><desc id="description">Emotional Injury leads to Comfort. Emotional Injury leads to Reduce Pain. Emotional Injury leads to Promote Healing. Emotional Injury leads to Prevent Future Injuries. Comfort leads to Improved Well-being. Reduce Pain leads to Improved Well-being. Promote Healing leads to Improved Well-being. Prevent Future Injuries leads to Improved Well-being.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 222)">
