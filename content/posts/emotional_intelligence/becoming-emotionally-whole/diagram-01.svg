<title id="title">The Journey to Wholeness: A Continuous Process</title><desc id="description">Spiritual Disciplines leads to Self-Awareness. Self-Awareness leads to Healthy Relationships. Healthy Relationships leads to Emotional Maturity. Emotional Maturity leads to Emotional Wholeness. Spiritual Disciplines leads to Forgiveness. Forgiveness leads to Emotional Maturity. Spiritual Disciplines leads to Prayer. Prayer leads to Emotional Maturity. Spiritual Disciplines leads to Bible Study. Bible Study leads to Emotional Maturity. Healthy Relationships leads to Accountability. Accountability leads to Emotional Maturity. Emotional Maturity leads to Professional Help - if needed.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 478)">
