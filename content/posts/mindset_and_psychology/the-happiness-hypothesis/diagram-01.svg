<title id="title">Visualization: The Rider and the Elephant</title><desc id="description">Rider (Reason) leads to Conscious Thought. Rider (Reason) leads to Planning. Rider (Reason) leads to Decision-Making. Elephant (Emotion) leads to Intuition. Elephant (Emotion) leads to Impulse. Elephant (Emotion) leads to Habits. Rider (Reason) leads to Elephant (Emotion) (Weak Control). Rider (Reason) leads to Elephant (Emotion) (dashed connection). Goal: Harmony: Rider (Reason), Elephant (Emotion).</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 324)">
