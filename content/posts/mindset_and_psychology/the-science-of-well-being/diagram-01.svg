<title id="title">Hedonic and Eudaimonic Well-being: The Two Pillars</title><desc id="description">Hedonic Well-being leads to Pleasure &amp; Pain Avoidance. Eudaimonic Well-being leads to Meaning &amp; Purpose. Pleasure &amp; Pain Avoidance leads to Short-term Gratification. Meaning &amp; Purpose leads to Long-term Fulfillment. Short-term Gratification leads to Long-term Fulfillment (Balanced).</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 333)">
