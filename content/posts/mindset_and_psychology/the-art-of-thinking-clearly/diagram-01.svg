<title id="title">Recognizing and Avoiding Cognitive Biases</title><desc id="description">Cognitive Biases leads to Confirmation Bias. Cognitive Biases leads to Anchoring Bias. Cognitive Biases leads to Availability Heuristic. Cognitive Biases leads to Survivorship Bias. Cognitive Biases leads to Halo Effect. Confirmation Bias leads to Seeking confirming evidence. Anchoring Bias leads to Over-reliance on initial information. Availability Heuristic leads to Judging based on memory availability. Survivorship Bias leads to Ignoring failures. Halo Effect leads to Generalizing from one trait.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 386)">
