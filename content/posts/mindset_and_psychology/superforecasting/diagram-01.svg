<title id="title">Key Characteristics of Superforecasters</title><desc id="description">Intellectual Humility leads to Open-mindedness. Open-mindedness leads to Curiosity &amp; Learning. Curiosity &amp; Learning leads to Pragmatism. Pragmatism leads to Analytical Skill. Analytical Skill leads to Numerical Literacy. Numerical Literacy leads to Superforecasting.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 530)">
