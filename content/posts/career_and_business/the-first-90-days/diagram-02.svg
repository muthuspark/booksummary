<title id="title">The "First 90 Days" Plan: A Framework for Action</title><desc id="description">Phase 1: Learning &amp; Acceleration leads to Rapid Learning. Phase 1: Learning &amp; Acceleration leads to Relationship Building. Phase 1: Learning &amp; Acceleration leads to Situational Diagnosis. Rapid Learning leads to Phase 2: Building Team &amp; Credibility. Relationship Building leads to Phase 2: Building Team &amp; Credibility. Situational Diagnosis leads to Phase 2: Building Team &amp; Credibility. Phase 2: Building Team &amp; Credibility leads to Demonstrate Competence. Phase 2: Building Team &amp; Credibility leads to Set Direction. Demonstrate Competence leads to Phase 3: Execution &amp; Strategic Planning. Set Direction leads to Phase 3: Execution &amp; Strategic Planning. Phase 3: Execution &amp; Strategic Planning leads to Long-Term Strategies. Phase 3: Execution &amp; Strategic Planning leads to Effective Delegation.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 478)">
