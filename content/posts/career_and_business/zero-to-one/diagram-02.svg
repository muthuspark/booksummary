<title id="title">Competitive vs. Monopolistic Businesses</title><desc id="description">Price Wars leads to Low Margins. Low Margins leads to Constant Innovation Pressure. Constant Innovation Pressure leads to Short-term Focus. High Margins leads to Long-term Vision. Long-term Vision leads to Sustainable Growth. Sustainable Growth leads to Reinvestement in Innovation. Competitive Business: Price Wars, Low Margins, Constant Innovation Pressure, Short-term Focus. Monopolistic Business: High Margins, Long-term Vision, Sustainable Growth, Reinvestement in Innovation.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 394)">
