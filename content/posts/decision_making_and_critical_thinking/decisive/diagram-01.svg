<title id="title">Understanding the Four Villains of Decision Making</title><desc id="description">Decision Making leads to Narrow Framing. Decision Making leads to Confirmation Bias. Decision Making leads to Short-Term Emotion. Decision Making leads to Overconfidence. Narrow Framing leads to Better Decisions (Combating Villains). Confirmation Bias leads to Better Decisions (Combating Villains). Short-Term Emotion leads to Better Decisions (Combating Villains). Overconfidence leads to Better Decisions (Combating Villains).</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 244)">
