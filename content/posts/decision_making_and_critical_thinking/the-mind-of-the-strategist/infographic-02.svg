<svg xmlns="http://www.w3.org/2000/svg" width="640" height="850" viewBox="0 0 640 850" role="img" aria-labelledby="title description">
  <title id="title">Four ways to find an advantage, with a repair-shop example</title>
  <desc id="description">Four alternatives, not four steps. Focus on key success factors: keep common repair parts ready. Build on relative superiority: make a repair specialty easy to book. Challenge assumptions through aggressive initiatives: try collecting equipment from customers. Explore strategic degrees of freedom: consider loan equipment while repairs take place. These repair-shop examples illustrate the summary and are not cases from the book. The small shapes are symbolic, not numerical data.</desc>
  <style>
    text { font-family: "Crimson Text", Georgia, serif; fill: #293e36; }
    .heading { font-size: 34px; font-weight: 600; }
    .explanation { font-size: 28px; fill: #475b52; }
    .example { font-size: 28px; fill: #775331; }
    .divider { stroke: #d8e2d9; stroke-width: 1; }
  </style>
  <text x="32" y="45" font-size="32">Four ways to find an advantage</text>
  <text x="32" y="85" class="explanation">Different choices, not a checklist.</text>

  <g aria-hidden="true" fill="#d7e1d9">
    <circle cx="47" cy="157" r="7"/><circle cx="79" cy="157" r="7"/>
    <circle cx="47" cy="189" r="7"/><circle cx="79" cy="189" r="7"/>
    <circle cx="63" cy="173" r="19" fill="#5b7e60" stroke="#fcfcfa" stroke-width="6"/>
  </g>
  <text x="130" y="151" class="heading">Focus on what matters</text>
  <text x="130" y="194" class="explanation">Put effort where it counts most.</text>
  <text x="130" y="234" class="example">Keep common repair parts ready.</text>
  <path d="M32 278 H608" class="divider"/>

  <g aria-hidden="true" fill="#d7e1d9">
    <circle cx="43" cy="373" r="9"/><circle cx="83" cy="373" r="9"/>
    <circle cx="63" cy="339" r="17" fill="#5b7e60"/>
  </g>
  <text x="130" y="341" class="heading">Use an existing strength</text>
  <text x="130" y="384" class="explanation">Build on what you do better.</text>
  <text x="130" y="424" class="example"><tspan x="130">Make your repair specialty</tspan><tspan x="130" dy="35">easy to find and book.</tspan></text>
  <path d="M32 482 H608" class="divider"/>

  <g aria-hidden="true" fill="none" stroke="#5b7e60" stroke-width="4" stroke-linecap="round">
    <path d="M84 562 A29 29 0 1 1 64 512"/>
    <path d="M64 543 L85 523"/>
  </g>
  <text x="130" y="545" class="heading">Question the usual way</text>
  <text x="130" y="588" class="explanation">Test an industry assumption.</text>
  <text x="130" y="628" class="example"><tspan x="130">Could you collect equipment</tspan><tspan x="130" dy="35">instead of asking people to visit?</tspan></text>
  <path d="M32 686 H608" class="divider"/>

  <g aria-hidden="true" fill="none" stroke="#91aa98" stroke-width="3" stroke-linecap="round">
    <path d="M38 768 Q38 722 88 746 M38 768 L88 746 M38 768 Q77 800 88 746"/>
    <circle cx="38" cy="768" r="6" fill="#5b7e60" stroke="none"/>
    <circle cx="88" cy="746" r="6" fill="#5b7e60" stroke="none"/>
  </g>
  <text x="130" y="749" class="heading">Find another way to help</text>
  <text x="130" y="792" class="explanation">Meet the need in a different way.</text>
  <text x="130" y="832" class="example">Offer loan equipment during repairs.</text>
</svg>
