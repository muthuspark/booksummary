<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760" role="img" aria-labelledby="title description">
  <title id="title">Focused and diffuse thinking: make time for effort and breaks</title>
  <desc id="description">Oakley's learning model contrasts focused thinking, working deliberately on a specific problem, with diffuse thinking, stepping away from concentrated work to give ideas room to connect. The dot patterns are symbolic illustrations, not images of brain activity. A practical rhythm is to try a problem, take a break, and return to try again. Breaks can support a fresh approach; they do not guarantee an insight.</desc>
  <style>
    text { font-family: "Crimson Text", Georgia, serif; fill: #293e36; }
    .heading { font-size: 36px; font-weight: 600; }
    .term { font-size: 28px; fill: #57785f; }
    .explanation { font-size: 28px; fill: #475b52; }
  </style>

  <text x="32" y="46" font-size="34">Two useful ways of thinking</text>

  <g aria-hidden="true">
    <circle cx="82" cy="184" r="52" fill="#edf3ee"/>
    <g fill="#57785f">
      <circle cx="68" cy="170" r="6"/><circle cx="95" cy="170" r="6"/>
      <circle cx="68" cy="197" r="6"/><circle cx="95" cy="197" r="6"/>
    </g>
    <circle cx="82" cy="184" r="33" fill="none" stroke="#91aa98" stroke-width="2"/>
  </g>
  <text x="170" y="127" class="heading">Work on one thing</text>
  <text x="170" y="169" class="term">Focused thinking</text>
  <text x="170" y="218" class="explanation"><tspan x="170">Read carefully. Try a step.</tspan><tspan x="170" dy="37">Check what you understand.</tspan></text>

  <path d="M32 300 H608" fill="none" stroke="#d8e2d9" stroke-width="1"/>

  <g aria-hidden="true">
    <circle cx="82" cy="414" r="52" fill="#f5efe5"/>
    <path d="M43 407 Q76 374 115 413 Q85 463 54 442" fill="none" stroke="#bdab91" stroke-width="2"/>
    <g fill="#8b704d">
      <circle cx="43" cy="407" r="6"/><circle cx="83" cy="383" r="6"/>
      <circle cx="115" cy="413" r="6"/><circle cx="54" cy="442" r="6"/>
    </g>
  </g>
  <text x="170" y="357" class="heading">Step away for a while</text>
  <text x="170" y="399" class="term">Diffuse thinking</text>
  <text x="170" y="448" class="explanation"><tspan x="170">Walk, rest, or do a simple task.</tspan><tspan x="170" dy="37">Give ideas room to connect.</tspan></text>

  <path d="M32 530 H608" fill="none" stroke="#d8e2d9" stroke-width="1"/>
  <text x="320" y="584" font-size="32" text-anchor="middle">A study rhythm to try</text>
  <g font-size="30" text-anchor="middle">
    <text x="95" y="645">Try</text>
    <text x="320" y="645">Take a break</text>
    <text x="545" y="645">Return</text>
  </g>
  <g fill="none" stroke="#91aa98" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M144 635 H204 M196 628 L204 635 L196 642"/>
    <path d="M432 635 H477 M469 628 L477 635 L469 642"/>
    <path d="M545 670 V685 Q545 701 529 701 H111 Q95 701 95 685 V670 M88 678 L95 670 L102 678"/>
  </g>
  <text x="320" y="743" class="explanation" text-anchor="middle">Repeat when you need a fresh approach.</text>
</svg>
