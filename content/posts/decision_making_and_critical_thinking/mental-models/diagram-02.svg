<title id="title">Choose a proportionate decision process</title><desc id="description">Can we undo this at acceptable cost? leads to Limit downside and define rollback (Yes). Can we undo this at acceptable cost? leads to Gather evidence and prepare safeguards (No). Limit downside and define rollback leads to Run a small pilot if downside is limited (Test). Gather evidence and prepare safeguards leads to Commit when sufficiently prepared (Decide). Run a small pilot if downside is limited leads to Record expectations and schedule review (Learn). Commit when sufficiently prepared leads to Record expectations and schedule review (Learn).</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 465)">
