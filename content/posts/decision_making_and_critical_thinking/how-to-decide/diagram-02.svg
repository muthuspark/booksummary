<title id="title">Developing a Decision-Making Framework</title><desc id="description">Problem Definition leads to Information Gathering. Information Gathering leads to Alternative Generation. Alternative Generation leads to Risk Assessment. Risk Assessment leads to Pre-Mortem Analysis. Pre-Mortem Analysis leads to Decision Making. Decision Making leads to Implementation. Implementation leads to Feedback &amp; Reflection. Feedback &amp; Reflection leads to Problem Definition.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 602)">
