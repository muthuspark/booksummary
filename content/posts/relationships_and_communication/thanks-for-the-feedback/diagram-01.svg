<title id="title">The Three Reactions to Feedback</title><desc id="description">Feedback Received leads to It's Not True?. Feedback Received leads to It's Not Fair?. Feedback Received leads to It's Not Helpful?. It's Not True? leads to Denial/Dismissal. It's Not Fair? leads to Resentment/Anger. It's Not Helpful? leads to Helplessness/Frustration.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 302)">
