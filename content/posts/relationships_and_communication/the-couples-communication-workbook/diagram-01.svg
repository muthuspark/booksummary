<title id="title">The Power of Active Listening</title><desc id="description">Speaker leads to Message. Message leads to Listener. Listener leads to Paying Attention. Listener leads to Withholding Judgment. Listener leads to Reflecting Understanding. Listener leads to Clarifying. Paying Attention leads to Acknowledgement. Withholding Judgment leads to Acknowledgement. Reflecting Understanding leads to Acknowledgement. Clarifying leads to Acknowledgement. Acknowledgement leads to Understanding. Understanding leads to Empathy.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 550)">
