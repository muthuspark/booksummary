<title id="title">Identifying Your Boundaries: Recognizing Needs and Limits</title><desc id="description">Self-Reflection leads to Identify Physical Needs. Self-Reflection leads to Identify Emotional Needs. Self-Reflection leads to Identify Spiritual Needs. Identify Physical Needs leads to Set Physical Boundaries. Identify Emotional Needs leads to Set Emotional Boundaries. Identify Spiritual Needs leads to Set Spiritual Boundaries. Set Physical Boundaries leads to Improved Well-being (Healthy Limits). Set Emotional Boundaries leads to Improved Well-being (Healthy Relationships). Set Spiritual Boundaries leads to Improved Well-being (Purpose &amp; Meaning).</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 350)">
