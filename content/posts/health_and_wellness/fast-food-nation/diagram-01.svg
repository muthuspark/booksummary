<title id="title">Visualizing the Interconnectedness</title><desc id="description">Consumer Demand leads to Fast Food Industry. Fast Food Industry leads to Exploitation of Labor. Fast Food Industry leads to Environmental Damage. Fast Food Industry leads to Public Health Crisis. Exploitation of Labor leads to Social Inequality. Environmental Damage leads to Social Inequality. Public Health Crisis leads to Social Inequality. Social Inequality leads to Need for Systemic Change. Consumer Demand leads to Need for Systemic Change. Need for Systemic Change leads to Informed Consumerism. Need for Systemic Change leads to Political Action. Need for Systemic Change leads to Support for Sustainable Practices.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 458)">
