<title id="title">The Importance of Methylation</title><desc id="description">Nutrients (B Vitamins, Choline) leads to Methylation Cycle. Methylation Cycle leads to Detoxification. Methylation Cycle leads to DNA Repair. Methylation Cycle leads to Neurotransmitter Production. Methylation Cycle leads to Immune Function. Immune Function leads to Reduced Inflammation. Detoxification leads to Reduced Inflammation. DNA Repair leads to Reduced Inflammation. Neurotransmitter Production leads to Reduced Inflammation. Reduced Inflammation leads to Improved Health. MTHFR leads to Methylation Cycle. COMT leads to Methylation Cycle. CBS leads to Methylation Cycle. Genetic Variations: MTHFR, Methylation Cycle, COMT, CBS.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 430)">
