<title id="title">The Gut-Brain Axis: A Communication Network</title><desc id="description">Brain leads to Vagus Nerve. Vagus Nerve leads to Gut. Gut leads to Hormones. Hormones leads to Brain. Gut leads to Immune Signals. Immune Signals leads to Brain. Gut leads to Neurotransmitters. Neurotransmitters leads to Brain.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 193)">
