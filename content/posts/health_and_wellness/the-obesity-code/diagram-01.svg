<title id="title">Insulin Resistance: The Core Problem</title><desc id="description">Food Intake leads to Increased Insulin. Increased Insulin leads to Insulin Resistance. Insulin Resistance leads to Glucose Accumulation. Glucose Accumulation leads to More Insulin. More Insulin leads to Insulin Resistance. Insulin Resistance leads to Fat Storage. Insulin Resistance leads to Fat Burning Inhibition.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 386)">
