<title id="title">The Science of Fasting: Insulin and Leptin</title><desc id="description">Eating leads to Insulin Release. Insulin Release leads to Fat Storage. Insulin Release leads to Leptin Suppression. Leptin Suppression leads to Increased Hunger. Fasting leads to Insulin Decrease. Insulin Decrease leads to Fat Burning. Insulin Decrease leads to Leptin Restoration. Leptin Restoration leads to Decreased Hunger.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 274)">
