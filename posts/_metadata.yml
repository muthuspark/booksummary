# options specified here will apply to all posts in this folder

# freeze computational output
# (see https://quarto.org/docs/projects/code-execution.html#freeze)
freeze: true

# Enable banner style title blocks
title-block-banner: true
title-block-categories: true
author-title: false

# Table of Contents for better navigation and SEO
toc: true
toc-depth: 3
toc-title: "Contents"
toc-location: right

# Reading time estimation
reading-time: true

# Image with SEO alt text and lazy loading
include-before-body:
    - text: |
        <img class="heroimage" src="./image.png" loading="lazy" decoding="async" fetchpriority="high" />