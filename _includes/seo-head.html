<!-- SEO Optimizations -->

<!-- Preconnect to external resources for faster loading -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.googletagmanager.com">
<link rel="dns-prefetch" href="https://pagead2.googlesyndication.com">

<!-- Additional SEO meta tags -->
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
<meta name="theme-color" content="#2780e3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#375a7f" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">

<!-- Organization Schema - Site-wide structured data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Book Summaries",
  "url": "https://summaries.muthu.co",
  "logo": "https://summaries.muthu.co/logo.png",
  "description": "Comprehensive summaries of 1000+ bestselling books covering self-help, business, psychology, fiction, and more.",
  "sameAs": []
}
</script>

<!-- WebSite Schema with SearchAction for sitelinks search -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Book Summaries",
  "url": "https://summaries.muthu.co",
  "description": "Discover comprehensive summaries of 1000+ bestselling books. Get key insights from top self-help, business, psychology, and fiction books in minutes.",
  "publisher": {
    "@type": "Organization",
    "name": "Book Summaries",
    "logo": {
      "@type": "ImageObject",
      "url": "https://summaries.muthu.co/logo.png"
    }
  },
  "potentialAction": {
    "@type": "SearchAction",
    "target": {
      "@type": "EntryPoint",
      "urlTemplate": "https://summaries.muthu.co/?q={search_term_string}"
    },
    "query-input": "required name=search_term_string"
  }
}
</script>
